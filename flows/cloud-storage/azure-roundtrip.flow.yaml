description: Full Azure Blob Storage round-trip — stage, upload, exists, head, list, server-side copy, cross-container move, delete. Proves the azure-blob-storage connector's complete object lifecycle, including a move with NO data loss / NO partial.
using:
  - environment/cloud-showcase
  - zenvara/filesystem as filesystem
  - zenvara/azure-blob-storage as azure-blob-storage
output:
  staged-path: !str
  exists-after-upload: !bool
  head-data: !any
  list-keycount: !int
  copy-status: !str
  move-status: !str
  exists-src-after-move: !bool
  exists-dest-after-move: !bool
  delete-resp: !any?
steps:
  - $save:
      create: filesystem.file
      with:
        Path: "showcase-azure-stage.txt"
        Content: "hello-azure-showcase"

  - $upload:
      create: azure-blob-storage.object
      with:
        Container: "example-container"
        Key: "showcase/up.txt"
        Input: "${save.path}"
    on: "az"

  - $exists-up:
      command: azure-blob-storage.object.exists
      with:
        Container: "example-container"
        Key: "showcase/up.txt"
    on: "az"

  - $head:
      command: azure-blob-storage.object.head
      with:
        Container: "example-container"
        Key: "showcase/up.txt"
    on: "az"

  - $listed:
      list: azure-blob-storage.object
      with:
        Container: "example-container"
        Prefix: "showcase/"
    on: "az"

  - $copied:
      command: azure-blob-storage.object.copy
      with:
        Container: "example-container"
        Key: "showcase/up.txt"
        DestKey: "showcase/copy.txt"
    on: "az"

  - $moved:
      command: azure-blob-storage.object.move
      with:
        Container: "example-container"
        Key: "showcase/copy.txt"
        DestContainer: "example-archive"
        DestKey: "showcase/moved.txt"
    on: "az"

  - $exists-src:
      command: azure-blob-storage.object.exists
      with:
        Container: "example-container"
        Key: "showcase/copy.txt"
    on: "az"

  - $exists-dest:
      command: azure-blob-storage.object.exists
      with:
        Container: "example-archive"
        Key: "showcase/moved.txt"
    on: "az"

  - $deleted:
      delete: azure-blob-storage.object
      with:
        Container: "example-container"
        Key: "showcase/up.txt"
    on: "az"

  - return:
      staged-path: "${save.path}"
      exists-after-upload: "${exists-up.exists}"
      head-data: "${head.data}"
      list-keycount: "${listed.keyCount}"
      copy-status: "${copied.status}"
      move-status: "${moved.status}"
      exists-src-after-move: "${exists-src.exists}"
      exists-dest-after-move: "${exists-dest.exists}"
      delete-resp: "${deleted.response}"
